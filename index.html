<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#f06c9b;--p2:#ff9ec0;--pl:#fff0f5;--pm:#f9cfe0;--t:#4a2b3a;--d:#d6477c;--w:#fff;--bg:linear-gradient(#fff,#fff5f9);--bg2:linear-gradient(#fff,#ffe3ee);--sh:#f06c9b40;--sh2:#f06c9b55;--sh3:#f06c9b14;--sa:#ffe8f1;--nb:#ffdce5;--nd:#f06c9b}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--t);display:flex;flex-direction:column;max-width:700px;margin:0 auto}
header{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:0 0 22px 22px;box-shadow:0 4px 16px var(--sh)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:38px;height:38px;border-radius:50%;background:#fff var(--av) center/cover;border:2px solid #fff}
.top h1{margin:0;font-size:18px;line-height:1.2}.top small{opacity:.9;font-size:12px}
.top div:nth-child(2){flex:1}
#adm[hidden]{display:none!important}.mx{direction:ltr;unicode-bidi:isolate;display:inline-block;max-width:100%}
#new,#out,#adm,#old{border:0;background:#ffffff38;color:#fff;border-radius:14px;padding:6px 12px;font:600 12px Cairo}
#subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}

#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pl) var(--av) center/cover;border:1.5px solid var(--pm)}
.m{max-width:88%;padding:9px 12px;border-radius:18px;line-height:1.7;font-size:14.5px;word-break:break-word}
.bot .m{background:var(--w);border:1.5px solid var(--pm);border-bottom-right-radius:6px;box-shadow:0 2px 8px var(--sh3)}
.me .m{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-bottom-left-radius:6px}
.body{white-space:pre-wrap}.body b{color:var(--d)}
.sec{border-right:4px solid;border-radius:12px;padding:6px 10px;margin:6px 0}
.s-a{background:var(--sa);border-color:var(--p)}.s-a b{color:var(--d)}
.s-b{background:#e6f3ff;border-color:#5aa9f0}.s-b b{color:#1f78c8}
.s-c{background:#fff6d6;border-color:#f2c94c}.s-c b{color:#b07d00}
.s-d{background:#ffe9dc;border-color:#f2994a}.s-d b{color:#cf5f0e}
.s-e{background:#e3f7ea;border-color:#52c27b}.s-e b{color:#1f8a4c}
.s-f{background:#f1e8ff;border-color:#a77be8}.s-f b{color:#7b45cc}
.fig{margin-top:10px;background:var(--pl);border:1.5px solid var(--pm);border-radius:14px;padding:8px}.fig svg{width:100%;height:auto;display:block}
.src{font-size:12px;opacity:.65;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border:1.5px solid var(--pm);background:var(--pl);color:var(--t);border-radius:14px;padding:4px 10px;font:600 12px Cairo}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0}
.cards button{border:1.5px solid var(--pm);background:var(--w);color:var(--t);border-radius:16px;padding:14px 8px;font:700 14px Cairo}
.qz{margin:10px 0;padding:10px;background:var(--pl);border-radius:14px}.qz p{margin:0 0 8px;font-weight:700}
.qz button{display:block;width:100%;text-align:right;margin:5px 0;border:1.5px solid var(--pm);background:var(--w);border-radius:12px;padding:8px 10px;font:500 14px Cairo;color:var(--t)}
.qz button.ok{background:#d7f5e3;border-color:#6fcf97}.qz button.no{background:var(--nb);border-color:var(--nd)}
.qz .ex{font-size:13px;margin-top:6px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--p);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

form{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--w);border-top:1.5px solid var(--pm)}

input:focus{border-color:var(--p)}
button.send{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:24px;padding:0 20px;font:700 15px Cairo}

.tool{flex:none;width:40px;border:1.5px solid var(--pm);background:var(--pl);border-radius:50%;font-size:19px;padding:0;color:var(--t)}
.tool.rec{background:#ff4d6d;color:#fff;border-color:#ff4d6d;width:auto;padding:0 12px;border-radius:24px;font:700 14px Cairo;animation:b 1s infinite}
#pend{display:none;padding:8px 14px 0;background:var(--w)}#pend.on{display:flex;align-items:center;gap:8px}

#nameP{position:fixed;inset:0;z-index:55;background:var(--bg2);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#nameP h2{margin:0;color:var(--d)}#nameP p{margin:0;opacity:.8}#nameIn,#userIn{width:min(320px,90%);text-align:center;flex:none}#userIn{direction:ltr}
.gl{width:112px;height:112px;border-radius:50%;background:#fff var(--av) center/cover;border:3px solid #fff;box-shadow:0 6px 20px var(--sh2)}
#gerr,#nameErr{color:var(--d);min-height:18px}
#gate{position:fixed;inset:0;z-index:50;display:flex;overflow:hidden;background:#fff}
#gate:before{content:"";position:absolute;top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px;background:#fff;z-index:3;box-shadow:0 0 14px #0003;transition:opacity .2s}
.half{flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(20px + env(safe-area-inset-top,0px)) 10px 190px;text-align:center;transition:flex-grow .45s cubic-bezier(.2,.8,.2,1),padding .45s,opacity .3s}
.half.b{--p:#2f80ed;--p2:#62b0ff;--d:#1b5fc9;--t:#1d2b4a;--sh2:#2f80ed66;background:linear-gradient(#fff,#d3e6ff)}
.half.g{--p:#f06c9b;--p2:#ff9ec0;--d:#d6477c;--t:#4a2b3a;--sh2:#f06c9b55;background:linear-gradient(#fff,#ffe3ee)}
.half h2{margin:0;font-size:17px;line-height:1.6;color:var(--d)}
.half .gl{width:clamp(76px,26vw,112px);height:clamp(76px,26vw,112px);flex:none}
.half.b .gl{background-image:var(--avb)}.half.g .gl{background-image:var(--avg)}
.cta{display:none;border-radius:22px;padding:9px 20px;font:700 15px Cairo;color:#fff;background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 4px 12px var(--sh2)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px #0002;transition:transform .35s}
.sheet>div{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.sheet h3{margin:0;font-size:19px;color:#2c2c3c}.sheet p{margin:0;font-size:13.5px;color:#666}
#gbtn{width:min(360px,100%);border:0;border-radius:26px;padding:14px 20px;font:700 16px Cairo;color:#fff;background:linear-gradient(to left,#2f80ed,#f06c9b);box-shadow:0 4px 14px #8a6fc055}
#gate:not(.pick) .s-pick,#gate.pick .s-login{display:none}
#gate.pick .half{cursor:pointer}#gate.pick .cta{display:inline-block}
#gate.go-m:before,#gate.go-f:before{opacity:0}
#gate.go-m .half.g,#gate.go-f .half.b{flex-grow:0;padding-inline:0;opacity:0}
#gate.go-m .sheet,#gate.go-f .sheet{transform:translateY(105%)}
.half:focus-visible{outline:3px solid var(--p);outline-offset:-6px}
@media (prefers-reduced-motion:reduce){.half,.sheet{transition:none}}
#admP{position:fixed;inset:0;z-index:60;background:var(--w);display:none;flex-direction:column;max-width:700px;margin:0 auto}#admP.on{display:flex}
#admH{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#admH b{flex:1}#admH button{border:0;background:#ffffff38;color:#fff;border-radius:12px;padding:6px 12px;font:600 13px Cairo}
#admB{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.uc{display:flex;gap:10px;align-items:center;text-align:right;border:1.5px solid var(--pm);background:var(--pl);border-radius:14px;padding:10px;font:500 14px Cairo;color:var(--t)}
.uc img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff}.uc small{display:block;opacity:.65}
.am{padding:9px 12px;border-radius:14px;max-width:92%;white-space:pre-wrap;line-height:1.7;font-size:14px}
.vbtn{border:0;background:#fff;border-radius:14px;padding:8px 14px;font:600 14px Cairo;color:var(--t)}
.am.me{background:var(--pm);align-self:flex-end}.am.bot{background:var(--pl);border:1px solid var(--pm);align-self:flex-start}
.bar{display:flex;gap:5px;margin-bottom:2px}.bar button{flex:1;min-width:0;padding:7px 4px;font-size:12px;white-space:nowrap}#subSel{flex:1.5;min-width:0;border:0;border-radius:14px;background:#fff;color:var(--p);padding:7px 6px;font:700 12.5px Cairo}
body{height:100dvh}header{padding-bottom:8px!important}.top{margin-bottom:6px!important}.top h1{font-size:16px!important}#chat{padding:10px 12px!important;gap:9px!important}
body.boy .s-b{background:#e1f6fb;border-color:#2bb5d6}body.boy .s-b b{color:#117f96}
body.adm .sec{background:#f3f3f3;border-color:#111}body.adm .sec b{color:#000}body.adm .s-b{background:#fff;border-color:#555}body.adm .s-c{background:#e9e9e9;border-color:#888}body.adm .s-d{background:#fafafa;border-color:#333}body.adm .s-e{background:#e0e0e0;border-color:#666}body.adm .s-f{background:#fff;border-color:#000}
body.adm .bot .m{border-color:#111}body.adm form{background:#000;border-top-color:#000}body.adm form .send{background:#fff;color:#000}body.adm .tool{border-color:#555}

#dama{margin-top:5px;border:0;background:#ffffff40;color:#fff;border-radius:14px;padding:4px 12px;font:700 12px Cairo}
.bdg{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:#25d366;color:#fff;font:700 11px Cairo;text-align:center;padding:0 5px;margin-inline-start:6px}
.ov{position:fixed;inset:0;max-width:700px;margin:0 auto;display:none;flex-direction:column;background:var(--w)}.ov.on{display:flex}
#ovl{max-width:none;margin:0;background:#0007;z-index:80;justify-content:flex-end;align-items:center}.cps{width:100%;max-width:700px;background:var(--w);border-radius:24px 24px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:82%;overflow:auto}
.cv{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:right;padding:9px 6px;border-bottom:1px solid var(--pm);font:600 14px Cairo;color:var(--t)}
.ai,.av2{flex:none;border-radius:50%;background:var(--pm) center/cover;display:grid;place-items:center;color:#fff;font-weight:700}.ai{width:46px;height:46px;font-size:20px}.av2{width:30px;height:30px;font-size:13px}
.cv .tx{flex:1;min-width:0}.cv b{display:block}.cv small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rm{z-index:70;background:var(--pl)}
#rmH{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#rmH button{border:0;background:#ffffff38;color:#fff;border-radius:12px;padding:6px 11px;font:700 13px Cairo}
#rmH .tx{flex:1;min-width:0}#rmH b,#rmH small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#rmH small{font-size:11px;opacity:.9}
#rmM{flex:1;overflow-y:auto;padding:10px;background:var(--pl);overscroll-behavior:contain}
.sp{text-align:center;margin:8px 0}.sp span{background:var(--w);border-radius:10px;padding:2px 10px;font-size:11.5px;box-shadow:0 1px 2px #0002}
.rw{display:flex;gap:6px;align-items:flex-end;margin-top:2px}.rw.fst{margin-top:8px}.rw.me{justify-content:flex-end}.rw:not(.fst) .av2{visibility:hidden}.rw.me .av2,#rm.sup .av2{display:none}
.bb{position:relative;max-width:80%;padding:5px 9px 3px;border-radius:14px;background:var(--w);box-shadow:0 1px 2px #0003;font-size:14.5px;line-height:1.6;word-break:break-word}
.rw.fst:not(.me) .bb{border-top-right-radius:3px}.rw.me .bb{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}.rw.fst.me .bb{border-top-left-radius:3px}
.bb.mn{outline:2px solid #ffd54f}.nm{font:700 12px Cairo}.rw:not(.fst) .nm,.rw.me .nm,#rm.sup .nm{display:none}
.tx2{white-space:pre-wrap}.tx2 a{color:inherit;text-decoration:underline}.mt{font-weight:700;color:var(--d)}.rw.me .mt{color:#fff;text-decoration:underline}
.mi{display:block;max-width:100%;max-height:300px;border-radius:10px;margin:2px 0;cursor:zoom-in}
.qt{border-right:3px solid var(--p);background:#0000000d;border-radius:8px;padding:3px 7px;margin-bottom:3px;font-size:12.5px;cursor:pointer}.qt b{display:block;color:var(--d)}.rw.me .qt{background:#ffffff30;border-color:#fff}.rw.me .qt b{color:#fff}
.mm{font-size:10.5px;opacity:.7;text-align:left}
.rxs{display:flex;gap:3px;flex-wrap:wrap}.rxs button{border:1px solid var(--pm);background:var(--w);color:var(--t);border-radius:12px;padding:0 6px;font:600 12px Cairo;margin-bottom:2px}.rxs .mine{background:var(--sa);border-color:var(--p)}
.vp{display:flex;align-items:center;gap:8px;min-width:200px}.vp button{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--p);color:#fff;font-size:14px}.rw.me .vp button{background:#fff;color:var(--p)}
.wv{flex:1;display:flex;align-items:center;gap:2px;height:28px}.wv i{flex:1;background:currentColor;opacity:.3;border-radius:2px}.wv i.on{opacity:1}.vp small{font-size:11px;opacity:.8;min-width:30px}
#rmC{background:var(--w);border-top:1px solid var(--pm);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.cmp{display:flex;gap:6px;align-items:flex-end}.cmp textarea{flex:1;border:1.5px solid var(--pm);border-radius:22px;padding:9px 14px;font:16px Cairo;background:var(--pl);color:var(--t);resize:none;max-height:110px;outline:none;min-width:0}
.cb{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--pl);font-size:19px;color:var(--t);padding:0}.cb.go{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#rmRp,#rmMn{background:var(--pl);border-radius:10px;margin-bottom:5px;font-size:13px;padding:5px 8px}#rmRp{display:flex;gap:6px;align-items:center;border-right:3px solid var(--p)}#rmRp span{flex:1;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#rmRp button{border:0;background:none;font-size:16px}
#rmRec{display:flex;align-items:center;gap:10px}#rmRec .dot{width:10px;height:10px;border-radius:50%;background:#ff4d6d;animation:b 1s infinite}
#rmRp[hidden],#rmMn[hidden],#rmRec[hidden],.cmp[hidden]{display:none!important}
#rmBl{display:none;text-align:center;padding:12px;font-size:13.5px;color:#666}#rmBl.on{display:block}#rmBl button{border:0;background:var(--pl);border-radius:12px;padding:6px 12px;font:700 13px Cairo;color:var(--d);margin-inline-start:6px}
#lb{position:fixed;inset:0;z-index:90;background:#000d;display:none;align-items:center;justify-content:center}#lb img{max-width:96%;max-height:96%}

.rw .bb{background:#efe9ff;color:#2b2350}.rw .mt{color:#6a3fd1}.rw .qt b{color:#6a3fd1}.rw .qt{border-color:#8f6bf0}
.rw.me .bb{background:linear-gradient(135deg,#0b9a85,#14b8a0);color:#fff}.rw.me .mt,.rw.me .qt b{color:#fff}.rw.me .qt{border-color:#fff}
.rw.ad .bb{background:#111;color:#fff}.rw.ad .mt,.rw.ad .qt b{color:#fff}.rw.ad .qt{background:#ffffff26;border-color:#fff}.rw.ad .vp button{background:#fff;color:#111}.rw.ad .nm{color:#ffd54f!important}
.rw.aim .bb{background:linear-gradient(135deg,#ffb703,#ffd166);color:#3b2a00}.rw.aim .mt,.rw.aim .qt b{color:#7a3e00}.rw.aim .qt{background:#00000012;border-color:#b45f06}.rw.aim .nm{color:#8a5a00!important}

/* ===== نصيحة كل صفحة (خفيفة، من غير blur) ===== */
#tip{position:fixed;z-index:2000;top:calc(8px + env(safe-area-inset-top,0px));left:10px;right:10px;max-width:520px;margin:0 auto;background:#fff;color:#2b2b3a;border-radius:18px;padding:12px 14px;box-shadow:0 8px 28px #0003;border:1.5px solid #f2d0dd;font-family:Cairo,system-ui,Tahoma,sans-serif;direction:rtl;text-align:right;animation:tipIn .25s ease}
#tip.low{top:auto;bottom:calc(78px + env(safe-area-inset-bottom,0px))}
#tip[hidden]{display:none}
#tip .th{display:flex;align-items:center;gap:8px;margin-bottom:8px}#tip .th b{flex:1}
#tip .xx{border:0;background:#f3f3f6;border-radius:50%;width:26px;height:26px;color:#444;font:inherit;padding:0}

@keyframes tipIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#tip,.tipHL{animation:none}}
#out{padding:0!important;width:36px;height:36px;flex:none;border-radius:50%!important;overflow:hidden;border:2px solid #fff!important;background:#ffffff38!important;display:grid;place-items:center;font:700 15px Cairo!important}#out img,#out i{width:100%;height:100%;object-fit:cover;display:block;background:center/cover;font-style:normal;text-align:center;line-height:32px}
#ann{flex:none;margin:8px 12px 0;padding:9px 12px;border-radius:14px;background:#ffd54f;color:#3b2a00;font:600 13.5px/1.7 Cairo,system-ui,sans-serif;display:flex;gap:8px;align-items:flex-start;box-shadow:0 2px 8px #0002}#ann span{flex:1;white-space:pre-wrap;word-break:break-word}#ann button{flex:none;border:0;background:#0000001a;border-radius:50%;width:24px;height:24px;padding:0;color:#3b2a00}#ann[hidden]{display:none}
</style>

  memList(c.g).forEach(x=>{const b=cv({p:x.p,n:x.n,a:x.a,title:x.n,sub:x.u?'@'+x.u:''});if(a&&!x.a){const d=mk('button','cb');d.type='button';d.textContent='✕';d.onclick=async()=>{if(confirm('تشيل '+x.n+' من الجروب؟'))await updateDoc(doc(db,...c.path),{members:arrayRemove(x.uid),['mem.'+x.uid]:deleteField()});shut()};b.append(d)}s.append(b)});
  if(a){const A=(l,f)=>{const b=mk('button','cv');b.type='button';b.textContent=l;b.onclick=f;s.append(b)};
    A('🖼 غيّر صورة الجروب',()=>{const fi=mk('input');fi.type='file';fi.accept='image/*';fi.hidden=true;s.append(fi);fi.onchange=async e=>{const x=e.target.files[0];if(!x)return;try{await updateDoc(doc(db,...c.path),{ph:await sq200(x)});shut()}catch(err){alert('الصورة ماتحفظتش')}};fi.click()});
    if(c.g.ph)A('↩️ شيل صورة الجروب',async()=>{try{await updateDoc(doc(db,...c.path),{ph:deleteField()});shut()}catch(e){alert('معرفتش أشيلها')}});
    A('➕ ضيف أعضاء',()=>pickUsers(c.g.members||[],async L=>{const u={members:arrayUnion(...L.map(x=>x.id))};L.forEach(x=>{u['mem.'+x.id]={n:x.n,u:x.u,p:x.p}});await updateDoc(doc(db,...c.path),u)}));
    A('✏️ غيّر الاسم',async()=>{const n=prompt('اسم الجروب',c.title);if(n&&n.trim()){await updateDoc(doc(db,...c.path),{name:n.trim().slice(0,40)});shut()}});
    if(R.qs&&R.qs.length)A('🏁 اعرض نتيجة الاختبار الحالي',()=>{shut();R.qs.forEach(sd=>{delete R.fin[sd.id];finish(sd)})});
    A('🗑 امسح الجروب',async()=>{if(confirm('تمسح الجروب بكل رسايله؟')){shut();await delGrp(c.path[1])}})}})}
/* ===== بروفايلات النظام + إعلان الأدمن (config/avatars و config/announce) ===== */
let ANN=null;const annOk=a=>!!a&&a.on!==false&&typeof a.t==='string'&&!!a.t.trim();
function drawAnn(){const b=$('ann');let x='';try{x=localStorage.getItem('ann_x')||''}catch(e){}
  if(!annOk(ANN)||String(ANN.id)===x){b.hidden=true;return}b.firstElementChild.textContent='📢 '+ANN.t;b.hidden=false}
$('annX').onclick=()=>{try{localStorage.setItem('ann_x',String(ANN&&ANN.id))}catch(e){}$('ann').hidden=true};
function startCfg(){
  onSnapshot(doc(db,'config','avatars'),s=>{const d=s.exists()?s.data():{};Object.keys(DEF).forEach(k=>{const u=d[k];setAv(k,typeof u==='string'&&u.length<200000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/.test(u)?u:DEF[k])});fav.href=CUR[isAdm(user)?'a':gender==='m'?'b':'g'];drawMe()},()=>{});
  onSnapshot(doc(db,'config','announce'),s=>{const n=s.exists()?s.data():null,was=ANN;ANN=n;if(BG.an&&!isAdm(user)&&annOk(n)&&(!was||was.id!==n.id))snd('nt');BG.an=1;drawAnn()},()=>{});
  if(isAdm(user))onSnapshot(collection(db,'pchg'),s=>{if(BG.pc&&s.docChanges().some(ch=>ch.type!=='removed'&&ch.doc.data().st==='pending'))snd('nt');BG.pc=1;PCH=s.docs.map(x=>({id:x.id,...x.data()}));badge();hubRef&&hubRef()},()=>{});
  else onSnapshot(doc(db,'pchg',user.uid),s=>{const d=PCHME=s.exists()?s.data():null;if(d&&d.st==='approved')return applyPc(d);if(d&&d.st==='rejected')return rejPc();PN=(d&&d.nn)||'';PP=(d&&d.np)||'';drawMe()},()=>{})}
const sq200=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=200;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,200,200);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=u});
function avTab(){
  const n=mk('p');n.textContent='التغيير بيظهر عند الكل. بروفايلات الطلاب مش بتتغيّر من هنا.';n.style.cssText='font-size:12.5px;opacity:.7;margin:0';
  const fi=mk('input');fi.type='file';fi.accept='image/*';fi.hidden=true;let cur='';admB.append(n,fi);
  fi.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;try{const d=await sq200(f);await setDoc(doc(db,'config','avatars'),{[cur]:d,at:serverTimestamp()},{merge:true})}catch(x){alert('الصورة ماتحفظتش، اتأكد من قواعد Firestore لـ config')}};
  [['g','🌸 فيفان (للبنات)'],['b','💙 اريكسو (للأولاد)'],['a','🖤 الأدمن (داما)'],['i','🤖 ai في الجروب']].forEach(([k,l])=>{
    const r=mk('div','uc'),p=mk('div','ai'),t=mk('div'),c=mk('button','vbtn'),x=mk('button','vbtn');p.style.backgroundImage='var('+VK[k]+')';t.style.flex='1';t.textContent=l;
    c.type=x.type='button';c.textContent='غيّر';x.textContent='↩️ الأصلية';c.onclick=()=>{cur=k;fi.click()};
    x.onclick=async()=>{if(confirm('ترجّع الصورة الأصلية؟'))try{await setDoc(doc(db,'config','avatars'),{[k]:deleteField()},{merge:true})}catch(e){alert('معرفتش أرجّعها')}};
    r.append(p,t,c,x);admB.append(r)})}
function anTab(){
  const ta=mk('textarea'),st=mk('p'),go=mk('button','send'),rm=mk('button','vbtn');
  ta.rows=4;ta.maxLength=500;ta.placeholder='اكتب الرسالة اللي هتظهر فوق عند كل الطلاب...';ta.value=annOk(ANN)?ANN.t:'';ta.style.cssText='width:100%;font:16px Cairo;border:1.5px solid var(--pm);border-radius:14px;padding:10px;background:var(--pl);color:var(--t)';
  st.style.cssText='font-size:12.5px;opacity:.7;margin:0';st.textContent=annOk(ANN)?'في إعلان ظاهر دلوقتي للكل':'مفيش إعلان ظاهر دلوقتي';
  go.type=rm.type='button';go.textContent='📢 انشر للكل';go.style.padding='11px';rm.textContent='🗑 شيل الإعلان';
  go.onclick=async()=>{const t=ta.value.trim();if(!t)return;try{await setDoc(doc(db,'config','announce'),{t:t.slice(0,500),id:Date.now(),on:true,at:serverTimestamp()});st.textContent='اتنشر ✅'}catch(e){alert('الإعلان ماتنشرش، اتأكد من قواعد Firestore لـ config')}};
  rm.onclick=async()=>{try{await setDoc(doc(db,'config','announce'),{t:'',on:false,at:serverTimestamp()});ta.value='';st.textContent='اتشال ✅'}catch(e){alert('معرفتش أشيل الإعلان')}};
  admB.append(ta,st,go,rm)}
/* ===== حسابي: الاسم والصورة واليوزر (مرة في الأسبوع لكل واحد) + تسجيل خروج ===== */
const WK=7*864e5;
async function loadMe(){try{const d=await getDoc(doc(db,'users',user.uid));const c=d.exists()?d.data().cp:'';if(typeof c==='string'&&c.length<60000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(c))MYP=c}catch(e){}}
function drawMe(){const b=$('out');if(!user)return;b.replaceChildren();
  if(isAdm(user)){const i=mk('i');i.style.backgroundImage='var(--ava)';b.append(i);return}
  const p=PP||myP();if(p){const i=new Image();i.src=p;i.referrerPolicy='no-referrer';i.alt='';i.onerror=()=>{b.replaceChildren(ltr())};b.append(i)}else b.append(ltr())}
const ltr=()=>{const i=mk('i');i.textContent=(uname||'?')[0];i.style.background='hsl('+hue(uname||'x')+' 55% 50%)';i.style.color='#fff';return i};
const sqp=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=128;c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.75))};im.onerror=rej;im.src=u});
function syncMem(p){const u={};Object.entries(p).forEach(([k,v])=>u['mem.'+user.uid+'.'+k]=v);[...GRS.map(g=>['groups',g.id]),...DMS.map(d=>['dms',d.id])].forEach(x=>updateDoc(doc(db,...x),u).catch(()=>{}))}
async function openMe(){
  const out=async()=>{await signOut(auth);location.reload()};
  if(isAdm(user))return sheet(s=>{const t=cv({a:1,title:ADM_NAME+' 👑',sub:'الأدمن'});t.style.pointerEvents='none';s.append(t);const b=mk('button','cv');b.type='button';b.textContent='🚪 تسجيل خروج';b.onclick=out;s.append(b)});
  let chg={};try{const d=await getDoc(doc(db,'users',user.uid));chg=(d.exists()&&d.data().chg)||{}}catch(e){}
  const left=k=>Math.max(0,Math.ceil((WK-(Date.now()-(+chg[k]||0)))/864e5));
  sheet(s=>{
    const top=mk('div');top.style.cssText='display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:8px';const av=avEl('ai',{p:PP||myP(),n:uname});av.style.cssText+='width:74px;height:74px;font-size:30px';const nm=mk('b'),un=mk('small');nm.textContent=PN||uname;un.textContent='@'+handle;un.dir='ltr';un.style.opacity='.65';top.append(av,nm,un);if(PN||PP){const pn=mk('small');pn.textContent='⏳ مستني موافقة الأدمن، الباقيين مش شايفينه لسه';pn.style.color='#b45f06';top.append(pn)}s.append(top);
    const row=(e,t,k,fn)=>{const l=left(k),pd=(k==='n'&&PN)||(k==='p'&&PP);s.append(cv({e,n:t,title:t,sub:pd?'⏳ مستني موافقة الأدمن':l?'متاح بعد '+l+' يوم':(k==='u'?'مرة كل أسبوع':'مرة كل أسبوع • بعد موافقة الأدمن'),fn:()=>{if(left(k))return alert('اتغيّر قريب، تقدر تغيّره تاني بعد '+left(k)+' يوم');fn()}}))};
    const fi=mk('input');fi.type='file';fi.accept='image/*';fi.hidden=true;s.append(fi);
    fi.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await sendPc({np:await sqp(f)});shut();alert('اتبعت للأدمن، والصورة هتظهر للباقيين لما يوافق ✅')}catch(x){alert('الطلب ماتبعتش ('+(x.code||x)+')')}};
    row('✏️','غيّر الاسم','n',()=>editF('n'));row('🖼','غيّر الصورة','p',()=>fi.click());row('🔤','غيّر اليوزر','u',()=>editF('u'));
    const b=mk('button','cv');b.type='button';b.textContent='🚪 تسجيل خروج';b.style.color='#d33';b.onclick=out;s.append(b)})}
function editF(k){
  sheet(s=>{const h=mk('h3'),i=mk('input'),e=mk('p'),w=mk('p'),b=mk('button','send');
    h.textContent=k==='n'?'غيّر اسمك':'غيّر اليوزر';h.style.cssText='margin:0 0 8px;text-align:center';
    i.value=k==='n'?uname:handle;i.maxLength=20;i.autocomplete='off';i.style.cssText='width:100%;margin-bottom:6px';if(k==='u'){i.dir='ltr';i.autocapitalize='none';i.spellcheck=false}
    e.style.cssText='color:var(--d);min-height:18px;font-size:13px;margin:0 0 6px;text-align:center';w.textContent=k==='n'?'مرة كل أسبوع، وبيظهر للباقيين بعد موافقة الأدمن.':'تقدر تغيّره مرة كل أسبوع بس، فاختار صح.';w.style.cssText='font-size:12.5px;opacity:.7;margin:0 0 6px;text-align:center';
    i.oninput=()=>{if(k==='n'){const c=i.value.replace(/[^\u0621-\u064A ]/g,'');if(c!==i.value){i.value=c;e.textContent='الاسم لازم يكون بالعربي ✍️'}else e.textContent=''}else{const l=i.value.toLowerCase(),c=l.replace(/[^a-z0-9_]/g,'');i.value=c;e.textContent=c!==l?'اليوزر إنجليزي وأرقام و _ بس':''}};
    b.type='button';b.textContent='حفظ';b.style.cssText='width:100%;padding:12px';
    b.onclick=async()=>{const v=i.value.trim().replace(/\s+/g,' ');
      if(k==='n'){if(!AR.test(v))return e.textContent='الاسم لازم يكون بالعربي ✍️';if(v===uname)return shut()}
      else{if(!UN.test(v))return e.textContent='اليوزر من 3 لـ 20 حرف: إنجليزي وأرقام و _';if(RES.has(v.toLowerCase()))return e.textContent='اليوزر ده محجوز، اختار غيره';if(v.toLowerCase()===handle.toLowerCase())return shut()}
      b.disabled=true;e.textContent='بحفظ...';
      try{
        if(k==='n'){await sendPc({nn:v});drawMe();alert('اتبعت للأدمن، والاسم هيظهر للباقيين لما يوافق ✅')}
        else{if(!(await claimHandle(v)))throw 'taken';const old=handle;await setDoc(doc(db,'users',user.uid),{username:v,chg:{u:Date.now()}},{merge:true});handle=v;try{localStorage.setItem('un_'+user.uid,v)}catch(x){}
          setDoc(doc(db,'usernames',v),{uid:user.uid,n:uname,p:myP()},{merge:true}).catch(()=>{});if(old&&old!==v)deleteDoc(doc(db,'usernames',old)).catch(()=>{});updateDoc(doc(db,'support',user.uid),{un:v}).catch(()=>{});syncMem({u:v})}
        shut()}
      catch(x){b.disabled=false;e.textContent=x==='taken'?'اليوزر ده مستخدم قبل كده':'معرفتش أحفظ، جرّب تاني'}};
    s.append(h,i,e,w,b);setTimeout(()=>i.focus(),100)})}
/* ===== طلبات تغيير الاسم/الصورة: للباقيين بعد موافقة الأدمن (pchg/{uid}) ===== */
async function sendPc(p){await setDoc(doc(db,'pchg',user.uid),{u:user.uid,h:handle,on:uname,op:myP(),st:'pending',at:serverTimestamp(),...p},{merge:true})}
async function applyPc(d){if(applyingPc)return;applyingPc=1;snd('nt');
  try{const u={chg:{}},now=Date.now(),sc={};
    if(d.nn){uname=d.nn;try{localStorage.setItem('nick_'+user.uid,d.nn)}catch(e){}u.nick=d.nn;u.chg.n=now;sc.n=d.nn}
    if(d.np){MYP=d.np;u.cp=d.np;u.photo=d.np;u.chg.p=now;sc.p=d.np}
    PN=PP='';await setDoc(doc(db,'users',user.uid),u,{merge:true});
    setDoc(doc(db,'usernames',handle),sc,{merge:true}).catch(()=>{});updateDoc(doc(db,'support',user.uid),sc).catch(()=>{});syncMem(sc);
    await deleteDoc(doc(db,'pchg',user.uid));drawMe()}
  catch(e){console.warn(e)}finally{applyingPc=0}}
async function rejPc(){if(applyingPc)return;applyingPc=1;snd('nt');PN=PP='';drawMe();try{await deleteDoc(doc(db,'pchg',user.uid))}catch(e){}applyingPc=0;alert('الأدمن رفض طلب تغيير الاسم أو الصورة')}
async function apvPc(r,ok){
  try{if(ok){const sc={};if(r.nn)sc.n=r.nn;if(r.np)sc.p=r.np;const u={};Object.entries(sc).forEach(([k,v])=>u['mem.'+r.u+'.'+k]=v);
      [...GRS.filter(g=>(g.members||[]).includes(r.u)).map(g=>['groups',g.id]),...DMS.filter(d=>(d.members||[]).includes(r.u)).map(d=>['dms',d.id])].forEach(x=>updateDoc(doc(db,...x),u).catch(()=>{}));
      updateDoc(doc(db,'users',r.u),{...(r.nn?{nick:r.nn}:{}),...(r.np?{photo:r.np,cp:r.np}:{})}).catch(()=>{});
      if(r.h)setDoc(doc(db,'usernames',r.h),sc,{merge:true}).catch(()=>{});updateDoc(doc(db,'support',r.u),sc).catch(()=>{})}
    await updateDoc(doc(db,'pchg',r.id),{st:ok?'approved':'rejected',ad:Date.now()})}
  catch(e){alert('معرفتش أنفّذ، اتأكد من قواعد Firestore لـ pchg')}}
function pcTab(){const L=PCH.filter(x=>x.st==='pending').sort((a,b)=>ms(b.at)-ms(a.at));
  if(!L.length){const p=mk('p');p.textContent='مفيش طلبات دلوقتي.';admB.append(p);return}
  L.forEach(r=>{const w=mk('div','uc');Object.assign(w.style,{flexDirection:'column',alignItems:'stretch'});
    const h=mk('b');h.textContent=(r.on||'طالب')+(r.h?' @'+r.h:'');w.append(h);
    if(r.nn){const p=mk('div');p.textContent='✏️ الاسم: '+(r.on||'—')+' ← '+r.nn;w.append(p)}
    if(r.np){const p=mk('div'),a=avEl('ai',{p:r.op,n:r.on}),b=avEl('ai',{p:r.np,n:r.nn||r.on}),t=mk('span');Object.assign(p.style,{display:'flex',alignItems:'center',gap:'10px'});t.textContent='←';p.append('🖼 ',a,t,b);w.append(p)}
    const bt=mk('div'),ok=mk('button','send'),no=mk('button','vbtn');bt.style.cssText='display:flex;gap:8px';ok.type=no.type='button';ok.textContent='✅ موافقة';no.textContent='❌ رفض';ok.style.cssText='flex:1;padding:9px';no.style.flex='1';
    ok.onclick=()=>apvPc(r,1);no.onclick=()=>apvPc(r,0);bt.append(ok,no);w.append(bt);admB.append(w)})}
onAuthStateChanged(auth,async u=>{
  if(!u){tip('login');return}hideTip();user=u;
  $('adm').hidden=!isAdm(u);
  if(started)return;started=true;startCfg();
  await loadMe();await ensureProfile();drawMe();$('gate').style.display='none';init();cloud();startMsgs();tip('chat');
});
</script>
