async function recStart(){

async function aiCall(b){const r=await fetch(WORKER_URL,{method:'POST',headers:await hdr(),body:JSON.stringify(b)});if(!r.ok)throw await wErr(r);const j=await r.json(),t=((j.candidates&&j.candidates[0]&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('');return JSON.parse((t.match(/\{[\s\S]*\}/)||['{}'])[0])}
async function postAI(arr){const c=R.c,ids={},bt=writeBatch(db),t0=Date.now(),mn=[];let lt='';
  arr.forEach((x,i)=>{const mr=doc(collection(db,...c.path,'msgs')),to=x.to&&memList(c.g).find(m=>(m.u||'').toLowerCase()===String(x.to).toLowerCase()),t=(to?'@'+to.u+'\n':'')+String(x.t||'').slice(0,3000)+(x.tail||'');
    bt.set(mr,{u:'ai',n:'اريكسو',ai:1,at:Timestamp.fromMillis(t0+i*3),t,...(to?{mn:[to.u.toLowerCase()]}:{}),...(x.quiz&&to?{qz:{s:x.sid,to:to.uid,tu:to.u,tn:to.n,...(x.end?{end:x.end}:{})}}:{})});
    if(to){ids[to.uid]=mr.id;mn.push(to.u.toLowerCase())}lt=t});
  if(arr.length){bt.update(doc(db,...c.path),{lastAt:serverTimestamp(),lastT:lt.slice(0,60),lastN:'اريكسو',lastU:'ai',lastMn:mn});await bt.commit()}
  return ids}
async function runAI(text){
  const c=R.c,mm=memList(c.g).filter(x=>!x.a&&x.u),lc=x=>String(x).toLowerCase().replace(/^@/,'').trim(),nz=x=>String(x).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim(),fm=x=>{if(!x)return null;const r=mm.find(m=>lc(m.u)===lc(x));if(r)return r;const k=mm.filter(m=>nz(m.n)===nz(x));return k.length===1?k[0]:null},un=Object.fromEntries(memList(c.g).map(m=>[m.uid,m.u]));R.ty=1;draw();
  try{
    const j=await aiCall({ai:'cmd',cmd:text.slice(0,1500),members:mm.map(x=>({u:x.u,n:x.n})),ment:[...new Set((text.match(/@[A-Za-z0-9_]+/g)||[]).map(z=>lc(z)))].filter(u=>mm.some(m=>lc(m.u)===u)),hist:R.list.filter(m=>!m.done&&m.t).slice(-8).map(m=>({w:m.n+(un[m.u]?' (@'+un[m.u]+')':''),t:m.t.slice(0,250)}))}),arr=(j.msgs||[]).slice(0,40);
    const mins=Math.min(60,Math.max(0,Math.round(+j.mins||0))),end=mins?Date.now()+mins*6e4:0;
    arr.forEach(x=>{const m=fm(x.to);x.to=m?m.u:null;if(!m)x.quiz=false});if(!arr.length)throw 0;
    const qz=arr.filter(x=>x.quiz&&x.to&&mm.some(m=>lc(m.u)===lc(x.to))),sid=qz.length?doc(collection(db,...c.path,'qs')).id:'';
    arr.forEach(x=>{x.sid=sid;if(!qz.includes(x))x.quiz=false;else if(end){x.end=end;x.tail='\n\n⏱ عندكم '+mins+' دقيقة'}});
    if(qz.length){const q={},to=[];qz.forEach(x=>{const m=mm.find(z=>lc(z.u)===lc(x.to));if(!q[m.uid]){to.push(m.uid);q[m.uid]={u:m.u,n:m.n,t:String(x.t)}}});await setDoc(doc(db,...c.path,'qs',sid),{to,q,mids:{},status:'open',at:serverTimestamp(),...(end?{end}:{})})}
    const ids=await postAI(arr);if(qz.length)await updateDoc(doc(db,...c.path,'qs',sid),{mids:ids});
  }catch(e){try{await postAI([{t:'معرفتش أنفّذ الأمر ده دلوقتي، جرّب تاني بعد شوية 🙏'+(isAdm(user)?' ['+dbg(e)+']':'')}])}catch(x){}}
  R.ty=0;draw()}
async function sendAns(q,t,auto){
  if(q.qz.c)return auto||alert('الاختبار خلص');
  if(q.qz.end&&!auto&&Date.now()>q.qz.end+3000)return alert('الوقت خلص');

  const c=R.c,mr=doc(collection(db,...c.path,'msgs')),bt=writeBatch(db);
  bt.set(mr,{u:user.uid,n:myN(),at:serverTimestamp(),done:1,rp:{id:q.id,n:q.n,t:q.t.slice(0,80)}});
  bt.set(doc(collection(db,...c.path,'ans')),{s:q.qz.s,u:user.uid,n:myN(),fu:q.qz.to,mid:mr.id,t:t.slice(0,2000),at:serverTimestamp()});
  bt.update(doc(db,...c.path),{lastAt:serverTimestamp(),lastT:'✅ خلّص إجابته',lastN:myN(),lastU:user.uid,lastMn:[]});
  rpOff();try{await bt.commit();try{localStorage.removeItem('dr_'+q.id)}catch(x){}}catch(e){if(!auto)alert('الإجابة ماتبعتتش، جرّب تاني')}}
function chk(){if(!R.qs||!R.ans)return;R.qs.forEach(sd=>{if(sd.status==='open'&&(sd.to.every(u=>R.ans.some(a=>a.s===sd.id&&a.u===u&&a.fu===u))||(sd.end&&Date.now()>=sd.end+8000)))finish(sd)})}
async function finish(sd){
  const c=R.c;if(R.fin[sd.id])return;R.fin[sd.id]=1;
  try{
    await updateDoc(doc(db,...c.path,'qs',sd.id),{status:'grading'});R.ty=1;draw();

      g=await aiCall({ai:'grade',items:sd.to.map(u=>{const a=A.find(x=>x.u===u&&x.fu===u);return{u:sd.q[u].u,n:sd.q[u].n,q:sd.q[u].t,a:a?a.t:'(مجاوبش)'}})}),subs=A.filter(a=>a.u!==a.fu);

    let out='📋 نتيجة الاختبار\n';
    sd.to.forEach(u=>{const q=sd.q[u],r=(g.r||[]).find(z=>String(z.u).toLowerCase()===q.u.toLowerCase())||{},p=pen[u]||0;out+='\n👤 '+q.n+' — '+Math.max(0,(+r.score||0)-p)+'/'+(+r.max||0)+(p?' (−'+p+')':'')+'\n'+(r.fb||'')+'\n'});
    subs.forEach(a=>{out+='\n⚠️ '+a.n+' جاوب مكان '+nm(a.fu)+' وانخصم من درجاته'});
    await Promise.allSettled([...A.map(a=>updateDoc(doc(db,...c.path,'msgs',a.mid),{t:(a.u!==a.fu?'⚠️ جاوب مكان '+nm(a.fu)+':\n':'')+a.t,done:deleteField()})),...Object.values(sd.mids||{}).filter(Boolean).map(id=>updateDoc(doc(db,...c.path,'msgs',id),{'qz.c':1}))]);
    await postAI([{t:out}]);await updateDoc(doc(db,...c.path,'qs',sd.id),{status:'done'});
  }catch(e){try{await updateDoc(doc(db,...c.path,'qs',sd.id),{status:'open'})}catch(x){}alert('معرفتش أصحح دلوقتي، جرّب "اعرض نتيجة الاختبار" من معلومات الجروب بعد شوية')}
  R.ty=0;draw()}
