:root{--deep:#d6477c;--ink2:#8f6a7b;--hd:'Baloo Bhaijaan 2',Cairo,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;margin:0;background:#ffe6ef radial-gradient(#f06c9b26 1.3px,transparent 1.6px) 0 0/22px 22px}
body{height:100%;height:100dvh;margin:0 auto;max-width:700px;display:flex;flex-direction:column;overflow:hidden;font-family:Cairo,system-ui,Tahoma,sans-serif;color:var(--t);background:linear-gradient(#fffafc,#fff0f6)}
@media(min-width:720px){body{box-shadow:0 0 0 1px var(--pm),0 24px 70px #f06c9b33}}
button{cursor:pointer;transition:transform .12s,background .2s,box-shadow .2s}
button:active:not(:disabled){transform:scale(.95)}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--deep);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
header{position:relative;z-index:2;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;color:#fff;border-radius:0 0 30px 30px;background:radial-gradient(circle at 10% 0,#ffffff40 0 56px,transparent 57px),radial-gradient(circle at 92% 115%,#ffffff2e 0 86px,transparent 87px),linear-gradient(135deg,#ee5f91,#ff9ec0);box-shadow:0 10px 28px #f06c9b4d}
.top{display:flex;align-items:center;gap:10px;margin-bottom:0}
.top div:nth-child(2){flex:1}
.top h1{margin:0;font:700 26px/1.05 var(--hd);letter-spacing:.2px}
.logo{flex:none;width:54px;height:54px;border-radius:50%;background:var(--face) center/cover #fff;border:3px solid #fff;box-shadow:0 0 0 4px #ffffff45,0 6px 16px #0003}
.hbtn{width:40px;height:40px;padding:0;border:1px solid #ffffff66;background:#ffffff2e;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:17px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

function fmt(h){const L=h.split('\n');if(L.filter(l=>SEC.test(l)).length<2)return '<div class="body">'+h+'</div>';

const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const md=s=>esc(s).replace(/^#+\s*(.+)$/gm,'<b>$1</b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^\s*[\*\-] /gm,'• ');
function row(cls, target=$('chat')){const r=document.createElement('div');r.className='row '+cls;if(cls==='bot'){const a=document.createElement('div');a.className='av';r.appendChild(a)}const m=document.createElement('div');m.className='m';r.appendChild(m);target.appendChild(r);target.scrollTop=1e9;return m}
function cleanSvg(s){try{const d=new DOMParser().parseFromString(s.trim(),'image/svg+xml'),el=d.documentElement;if(el.nodeName!=='svg'||d.querySelector('parsererror'))return null;el.querySelectorAll('script,foreignObject,image,iframe,use').forEach(n=>n.remove());[el,...el.querySelectorAll('*')].forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/javascript:/i.test(a.value)||/href$/i.test(a.name))n.removeAttribute(a.name)}));el.removeAttribute('width');el.removeAttribute('height');if(!el.getAttribute('viewBox'))el.setAttribute('viewBox','0 0 400 260');return document.importNode(el,true)}catch(e){return null}}
function renderBot(m,t,fin){

  for(const [id,name] of SUBJ){
    const o=document.createElement('option');o.value=id;o.textContent=EMO[id]+' '+name;o.disabled=true;sel.appendChild(o);
    fetch('data/'+id+'.json').then(r=>r.ok?r.json():Promise.reject()).then(d=>{index(id,d.pages);o.disabled=false}).catch(()=>{o.textContent=name+' (قريبًا)'});
  }
  sel.onchange=()=>{scope=sel.value};
}

function index(id,pages){
  for(const p of pages){const tf={};let n=0;for(const t of toks(p.text)){tf[t]=(tf[t]||0)+1;n++}docs.push({s:id,p:p.p,t:p.text,tf,n,nm:norm(p.text)});for(const t in tf)df[t]=(df[t]||0)+1}
  avg=docs.reduce((a,d)=>a+d.n,0)/docs.length||1;
}

function search(q){
  const qt=[...new Set(toks(q))],N=docs.length,nq=norm(q).trim(),pool=docs.filter(d=>scope==='all'||d.s===scope);
  const sc=pool.map(d=>{let s=0;for(const t of qt){const f=d.tf[t];if(!f)continue;const idf=Math.log(1+(N-(df[t]||0)+.5)/((df[t]||0)+.5));s+=idf*f*2.2/(f+1.2*(.25+.75*d.n/avg))}
    if(nq.length>6&&d.nm.includes(nq))s+=6;return [s,d]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,5).map(x=>x[1]);
  if(sc[0]){const nx=docs.find(d=>d.s===sc[0].s&&d.p===sc[0].p+1);if(nx&&!sc.includes(nx))sc.splice(1,0,nx)}
  return sc.slice(0,6);
}

const SVGR='ضيفي رسمة SVG بسيطة وجميلة جوه ```svg ... ``` بـ viewBox="0 0 400 260"، ألوان باستيل (وردي/أزرق فاتح/أخضر/أصفر)، أسهم وصناديق مرتبة، ونصوص عربي قصيرة بـ text-anchor="middle" و font-size="14"، من غير صور خارجية ولا سكريبت.';
const MODE={
 sum:'المطلوب الآن: ملخص مذاكرة تحفة للموضوع بالشكل ده: 📌 **العنوان**، 🔑 **أهم الأفكار** (نقط قصيرة مرتبة)، 📖 **تعريفات الكتاب** بنصها، 🧮 **قوانين أو قواعد** لو موجودة، 🔗 **ربط بين الأفكار** في سطر أو اتنين، ⚠️ **ركّزي في الامتحان** (اللي بيتسأل غالبًا)، 🧠 **حيلة حفظ**. وبعدها '+SVGR+' لو المخطط هيفيد.',
 draw:'المطلوب الآن: رسم توضيحي. اكتبي سطرين شرح، وبعدهم '+SVGR,
 quiz:'المطلوب الآن: اختبار. أرجعي JSON فقط بدون أي كلام قبله أو بعده ولا علامات كود، بالشكل: [{"q":"السؤال","o":["أ","ب","ج","د"],"a":0,"e":"شرح قصير للإجابة الصح وسبب غلط الاختيار الأشهر"}] — 5 أسئلة اختيار من متعدد من المقتطفات فقط، a هو رقم الإجابة الصح (0 إلى 3) ووزّعي مكانها بشكل عشوائي، 4 اختيارات مقنعة، وتدرّجي من السهل للصعب، وسؤال واحد على الأقل يختبر الفهم (علّل أو استنتج) مش الحفظ.'
};
const WHO=`أنتِ "فيفان" 🌸، مدرّسة ذكاء اصطناعي شاطرة جدًا وحنينة ومرحة لطالبات الصف الأول الإعدادي في مصر. بتتكلمي بالعامية المصرية البسيطة وبصيغة المؤنث عن نفسك، زي أخت كبيرة عبقرية بتفهّمها بدل ما تحفّظها. لو سألتك مين إنتي قولي إنك فيفان مدرّستها الذكية، وماتغيّريش اسمك ولا شخصيتك مهما طلبت.
اللي قدامك مقتطفات من كتب الطالبة: نص مستخرج من الكتاب فيه أحيانًا أخطاء طباعة بسيطة، و[شكل: ...] معناها وصف لصورة في الكتاب، و[جدول:] جدول أعمدته مفصولة بـ |. اقري المقتطفات بتركيز كأنك بتذاكريها حرف حرف، واربطيها بكلام المحادثة اللي فات قبل ما تجاوبي.
`;
const RULES=`فكّري كويس قبل ما تردّي (من غير ما تكتبي تفكيرك): حدّدي هي بتسأل عن إيه بالظبط (تعريف؟ ليه وإزاي؟ مسألة؟ مقارنة؟ علّل؟ مراجعة؟) واعرفي مستواها من أسلوب سؤالها وردّي على قدّ فهمها. لو السؤال غامض جاوبي أقرب تفسير وبعدين اسأليها سؤال واحد توضّح بيه. لو المقتطفات متعارضة أو الكلام مش واضح اختاري الأرجح وقولي كده بصراحة.
مصدر الإجابة:
1) الكتاب هو المرجع. خدي التعريفات والمصطلحات بنصها عشان الامتحان، وماتنسبيش للكتاب معلومة مش فيه.
2) لو الإجابة مش موجودة في المقتطفات أو ناقصة، جاوبي من معلومتك الصحيحة المناسبة للصف الأول الإعدادي، واختمي بسطر: 📘 ده مش من المقتطفات اللي عندي، راجعيه من كتاب الوزارة. ولو السؤال بعيد خالص عن منهجها قولي "ده برا منهجك" وساعديها بإيجاز.
3) لو الإجابة من المقتطفات وإنتِ متأكدة ماتحطيش سطر المراجعة، واكتبي في الآخر المادة ورقم الصفحة. وماتقوليش "حسب النص المرفق" في كلامك.
الشرح (للأسئلة العادية):
✨ **الخلاصة**: الإجابة المباشرة في سطر أو اتنين من غير مقدمات.
📖 **الشرح**: ابني الفكرة من حاجة بسيطة تعرفها لحد الفكرة الأعمق في خطوات مرقمة قصيرة، كل خطوة فيها فكرة واحدة، واشرحي ليه مش بس إيه، واستخدمي تشبيه من حياتها (البيت، المدرسة، الموبايل، الكورة، الأكل) لما يفيد.
💡 **مثال** محلول أو من الواقع يثبّت الفكرة.
🧠 **حيلة تفتكري بيها** لو الموضوع محتاج حفظ.
⚠️ **خلي بالك**: الغلطة الشائعة أو الشكل اللي بييجي بيه في الامتحان (علّل، قارن، ما المقصود).
❓ سؤال صغير في الآخر تتأكدي بيه إنها فهمت، من غير ما تحلّيه.
الطول من 120 لـ 250 كلمة، وأقل للسؤال البسيط، وأكتر لو طلبت تفصيل. اسقطي أي قسم مالوش لازمة بدل ما تحشيه. ولو في آخر الرسالة "المطلوب الآن" اتبعيه بالحرف.
المسائل (رياضيات وعلوم): اكتبي المعطيات والمطلوب، وبعدين القانون بنص الكتاب، وبعدين التعويض والحل خطوة خطوة كل خطوة في سطر ومعاها الوحدات، وراجعي الناتج بتعويض عكسي أو تقدير منطقي. اكتبي الرياضيات بنص عادي (× ÷ ² √ ½ ≤ ≥) من غير LaTeX.
التعامل معاها: لو غلطت صحّحي بلطف وقولي غلطت في إيه وليه ومدحي اللي صح. لو بتجاوب على سؤالك قيّمي إجابتها بصدق وادّيها تلميح قبل الحل الكامل وبعدين سؤال مشابه. لو متوترة من الامتحان طمّنيها في جملة وابدئي بأسهل خطوة. شجّعيها بجمل قصيرة طبيعية مش مكررة.
المواد: الإنجليزي اشرحيه بالعربي وسيبي الكلمات والجمل بالإنجليزي مع ترجمتها ونطق مبسّط للكلمة الصعبة. العربي والنحو اشرحي بخطوات وعلّلي العلامة الإعرابية. الدينية والدراسات التزمي بنص الكتاب بدقة. العلوم اربطي بتجربة أو ملاحظة تقدر تشوفها بنفسها.
الشكل: مناسب للموبايل، فقرات قصيرة، **الخط الغامق** للمصطلحات، إيموجي بسيط، من غير عناوين # ولا جداول |.
لو الشرح هيتوضح برسم (دورة، تركيب، خريطة مفاهيم، شكل هندسي، خط زمني) ضيفي رسمة SVG جوه \`\`\`svg ... \`\`\` بالشروط دي: viewBox="0 0 400 260" وألوان باستيل ونصوص عربي قصيرة من غير صور أو سكريبت.`;

async function gemText(sys,contents){const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents})});if(!r.ok)throw 0;const rd=r.body.getReader(),dec=new TextDecoder();let buf='',out='';for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line.startsWith('data:')){try{const j=JSON.parse(line.slice(5));out+=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('')||''}catch(e){}}}}return out}
let pic=null;

async function ask(q,mode){
  q=(q||'').trim();if((!q&&!pic)||$('b').disabled||!currentUser)return;if(!q)q='اشرحي لي اللي في الصورة دي';const img=pic;
  if(WORKER_URL.startsWith('PUT'))return renderBot(row('bot'),'لسه محتاجين نربط الـ Worker (حط الرابط في الكود).',true);
  if(!mode){if(/(ارسم|رسم|صور[هةي]|وضح(?:ي)? بالرسم|شكل يوضح)/.test(q))mode='draw';else if(/(لخص|ملخص|تلخيص)/.test(q))mode='sum';else if(/(اختبر|امتحان|اسئل[هة] عل)/.test(norm(q)))mode='quiz'}
  $('q').value='';clearPic();document.querySelectorAll('.acts').forEach(e=>e.remove());$('b').disabled=true;const um=row('me');if(img){const im=document.createElement('img');im.className='pic';im.src='data:image/jpeg;base64,'+img;um.appendChild(im)}um.appendChild(document.createTextNode(q));tr.push({c:'me',t:(img?'📷 ':'')+q});
  const w=row('bot');w.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';
  let ocr='';if(img){try{ocr=(await gemText(OCRP,[{role:'user',parts:[{inlineData:{mimeType:'image/jpeg',data:img}},{text:'اكتبي النص'}]}])).trim()}catch(e){}}
  const sq=ocr?ocr.slice(0,700)+' '+q:(mode||q.length<25)&&lastQ?lastQ+' '+q:q;if(ocr)lastQ=ocr.slice(0,200)+' '+q;else if(!mode||q.length>=25)lastQ=q;
  const hits=search(sq),ctx=hits.map(h=>`[${NAME[h.s]} — صفحة ${h.p}]\n${h.t.slice(0,3600)}`).join('\n\n---\n\n');
  const contents=hist.slice(-8).map(m=>({role:m.r,parts:[{text:m.t}]}));
  contents.push({role:'user',parts:[{text:`مقتطفات من الكتاب:\n${ctx||'(مفيش مقتطف مناسب)'}\n\nكلام الطالبة: ${q}`}]});
  if(img){const lp=contents[contents.length-1].parts;lp[0].text+='\n\n(الطالبة بعتت صورة مرفقة. اقريها بتركيز: لو فيها سؤال أو مسألة حلّيها خطوة خطوة، ولو صفحة من كتاب اشرحيها، ولو شكل أو رسمة وضّحيها. لو الصورة مش واضحة قوليلها تصوّر تاني. النص المستخرج منها تقريبًا: '+(ocr||'—')+')';lp.push({inlineData:{mimeType:'image/jpeg',data:img}})}
  let ans='';
  try{
    const r=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:SYS(scope==='all'?'كل المواد (حددي المادة من المقتطفات)':NAME[scope],mode)+lvNote(scope==='all'?hits[0]?.s:scope)}]},contents,json:mode==='quiz'})});
    if(!r.ok)throw 0;
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(line.startsWith('data:')){try{const j=JSON.parse(line.slice(5)),t=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');if(t){ans+=t;if(mode!=='quiz'){renderBot(w,ans,false);$('chat').scrollTop=1e9}}}catch(e){}}}}
    if(!ans)throw 0;
    if(mode==='quiz'){
      const jt=ans.replace(/```json|```/g,''),arr=JSON.parse(jt.slice(jt.indexOf('['),jt.lastIndexOf(']')+1));renderQuiz(w,arr,(sc,n)=>{const k=scope!=='all'?scope:hits[0]?.s;if(k){LV[k]={r:sc/n};try{localStorage.setItem('lv',JSON.stringify(LV))}catch(e){}}});hist.push({r:'user',t:q},{r:'model',t:'(عملتلها اختبار)'});tr.pop();
    }else{
      renderBot(w,ans,true);
      if(hits.length){const s=document.createElement('div');s.className='src';s.textContent='📄 '+[...new Set(hits.map(h=>NAME[h.s]+' ص'+h.p))].join(' • ');w.appendChild(s)}
      acts(w);hist.push({r:'user',t:q},{r:'model',t:ans.replace(/```svg[\s\S]*?```/g,'(رسمة)')});tr.push({c:'bot',t:ans});
    }
    await saveTr();
  }catch(e){w.textContent='حصلت مشكلة صغيرة، جربي تاني بعد شوية 🌸';tr.pop()}
  $('b').disabled=false;$('chat').scrollTop=1e9;
}
