<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فيفان 🌸 أولى إعدادي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#f06c9b;--p2:#ff9ec0;--pl:#fff0f5;--pm:#f9cfe0;--t:#4a2b3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:linear-gradient(#fff,#fff5f9);color:var(--t);display:flex;flex-direction:column;max-width:700px;margin:0 auto}
header{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:0 0 22px 22px;box-shadow:0 4px 16px #f06c9b40}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff var(--av) center/cover;border:2px solid #fff}
.top h1{margin:0;font-size:18px;line-height:1.2}.top small{opacity:.9;font-size:12px}
.top div:nth-child(2){flex:1}
#new,#out,#adm,#old{border:0;background:#ffffff38;color:#fff;border-radius:14px;padding:6px 12px;font:600 12px Cairo}
#subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sub{flex:none;border:0;background:#ffffff30;color:#fff;border-radius:18px;padding:6px 12px;font:600 13px Cairo}
.sub.on{background:#fff;color:var(--p)}.sub:disabled{opacity:.45}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pl) var(--av) center/cover;border:1.5px solid var(--pm)}
.m{max-width:88%;padding:11px 14px;border-radius:20px;line-height:1.85;font-size:15px;word-break:break-word}
.bot .m{background:#fff;border:1.5px solid var(--pm);border-bottom-right-radius:6px;box-shadow:0 2px 8px #f06c9b14}
.me .m{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-bottom-left-radius:6px}
.body{white-space:pre-wrap}.body b{color:#d6477c}
.fig{margin-top:10px;background:var(--pl);border:1.5px solid var(--pm);border-radius:14px;padding:8px}.fig svg{width:100%;height:auto;display:block}
.src{font-size:12px;opacity:.65;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border:1.5px solid var(--pm);background:var(--pl);color:var(--t);border-radius:14px;padding:4px 10px;font:600 12px Cairo}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0}
.cards button{border:1.5px solid var(--pm);background:#fff;color:var(--t);border-radius:16px;padding:14px 8px;font:700 14px Cairo}
.qz{margin:10px 0;padding:10px;background:var(--pl);border-radius:14px}.qz p{margin:0 0 8px;font-weight:700}
.qz button{display:block;width:100%;text-align:right;margin:5px 0;border:1.5px solid var(--pm);background:#fff;border-radius:12px;padding:8px 10px;font:500 14px Cairo;color:var(--t)}
.qz button.ok{background:#d7f5e3;border-color:#6fcf97}.qz button.no{background:#ffdce5;border-color:#f06c9b}
.qz .ex{font-size:13px;margin-top:6px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--p);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
form{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1.5px solid var(--pm)}
input{flex:1;padding:12px 16px;border:1.5px solid var(--pm);border-radius:24px;font:16px Cairo;background:var(--pl);color:var(--t);min-width:0;outline:none}
input:focus{border-color:var(--p)}
button.send{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:24px;padding:0 20px;font:700 15px Cairo}
button:disabled{opacity:.5}
.tool{flex:none;width:44px;border:1.5px solid var(--pm);background:var(--pl);border-radius:50%;font-size:19px;padding:0;color:var(--t)}
.tool.rec{background:#ff4d6d;color:#fff;border-color:#ff4d6d;width:auto;padding:0 12px;border-radius:24px;font:700 14px Cairo;animation:b 1s infinite}
#pend{display:none;padding:8px 14px 0;background:#fff}#pend.on{display:flex;align-items:center;gap:8px}
#pend img{height:56px;border-radius:10px;border:1.5px solid var(--pm)}#pend button{border:0;background:var(--pl);border-radius:50%;width:26px;height:26px;color:var(--t)}
#gate{position:fixed;inset:0;z-index:50;background:linear-gradient(#fff,#ffe3ee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#gate h2{margin:0;color:#d6477c}#gate p{margin:0;opacity:.8}
.gl{width:112px;height:112px;border-radius:50%;background:#fff var(--av) center/cover;border:3px solid #fff;box-shadow:0 6px 20px #f06c9b55}
#gbtn{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:26px;padding:14px 26px;font:700 16px Cairo;box-shadow:0 4px 14px #f06c9b55}
#gerr{color:#d6477c;min-height:18px}
#admP{position:fixed;inset:0;z-index:60;background:#fff;display:none;flex-direction:column;max-width:700px;margin:0 auto}#admP.on{display:flex}
#admH{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#admH b{flex:1}#admH button{border:0;background:#ffffff38;color:#fff;border-radius:12px;padding:6px 12px;font:600 13px Cairo}
#admB{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.uc{display:flex;gap:10px;align-items:center;text-align:right;border:1.5px solid var(--pm);background:var(--pl);border-radius:14px;padding:10px;font:500 14px Cairo;color:var(--t)}
.uc img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff}.uc small{display:block;opacity:.65}
.am{padding:9px 12px;border-radius:14px;max-width:92%;white-space:pre-wrap;line-height:1.7;font-size:14px}
.am.me{background:var(--pm);align-self:flex-end}.am.bot{background:var(--pl);border:1px solid var(--pm);align-self:flex-start}
.bar{display:flex;gap:6px;margin-bottom:8px}.bar button{flex:1;padding:8px 6px;font-size:13px;white-space:nowrap}
</style>
</head>
<body>
<div id="gate"><div class="gl"></div><h2>أهلًا بيكي مع فيفان 🌸</h2><p>سجّلي دخول بحساب جوجل عشان نحفظلك محادثاتك</p><button id="gbtn">🔐 سجّلي دخول بجوجل</button><small id="gerr"></small></div>
<div id="admP"><div id="admH"><button id="admBack">رجوع</button><b id="admT">👑 لوحة الأدمن</b><button id="admX">إغلاق</button></div><div id="admB"></div></div>
<header><div class="top"><div class="logo"></div><div><h1>فيفان</h1><small>مدرّستك الذكية • أولى إعدادي</small></div><button id="out">خروج</button></div><div class="bar"><button id="old">🕘 المحادثات القديمة</button><button id="new">✨ محادثة جديدة</button><button id="adm" hidden>👑 محادثات الطلاب</button></div><div id="subs"></div></header>
<div id="chat"></div>
<div id="pend"></div>

function index(id,pages){
  for(const p of pages){const tf={};let n=0;for(const t of toks(p.text)){tf[t]=(tf[t]||0)+1;n++}docs.push({s:id,p:p.p,t:p.text,tf,n,nm:norm(p.text)});for(const t in tf)df[t]=(df[t]||0)+1}
  avg=docs.reduce((a,d)=>a+d.n,0)/docs.length||1;
}
function setScope(id,b){scope=id;document.querySelectorAll('.sub').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function search(q){
  const qt=[...new Set(toks(q))],N=docs.length,nq=norm(q).trim(),pool=docs.filter(d=>scope==='all'||d.s===scope);
  const sc=pool.map(d=>{let s=0;for(const t of qt){const f=d.tf[t];if(!f)continue;const idf=Math.log(1+(N-(df[t]||0)+.5)/((df[t]||0)+.5));s+=idf*f*2.2/(f+1.2*(.25+.75*d.n/avg))}
    if(nq.length>6&&d.nm.includes(nq))s+=6;return [s,d]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,5).map(x=>x[1]);
  if(sc[0]){const nx=docs.find(d=>d.s===sc[0].s&&d.p===sc[0].p+1);if(nx&&!sc.includes(nx))sc.splice(1,0,nx)}
  return sc.slice(0,6);
}

4) لو غلطت صححيلها بلطف وقوليلها ليه.

اسم الطالبة: ${uname||'غير معروف'} (نادي عليها باسمها أحيانًا بشكل طبيعي).
المادة المختارة: ${sc}.
${MODE[mode]||''}`;

onAuthStateChanged(auth,u=>{
  if(!u)return;user=u;uname=(u.displayName||'').split(' ')[0];$('gate').style.display='none';
  if((u.email||'').toLowerCase()===ADMIN&&u.emailVerified!==false)$('adm').hidden=false;
  if(!started){started=true;init();cloud()}
});
</script>
