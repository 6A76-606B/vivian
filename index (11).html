<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فيفان 🌸 أولى إعدادي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#f06c9b;--p2:#ff9ec0;--pl:#fff0f5;--pm:#f9cfe0;--t:#4a2b3a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Cairo,system-ui,Tahoma,sans-serif;background:linear-gradient(#fff,#fff5f9);color:var(--t);display:flex;flex-direction:column;max-width:700px;margin:0 auto}
header{padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:0 0 22px 22px;box-shadow:0 4px 16px #f06c9b40}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.logo{width:38px;height:38px;border-radius:50%;background:#fff var(--av) center/cover;border:2px solid #fff}
.top h1{margin:0;font-size:18px;line-height:1.2}.top small{opacity:.9;font-size:12px}
.top div:nth-child(2){flex:1}
#adm[hidden]{display:none!important}.mx{direction:ltr;unicode-bidi:isolate;display:inline-block;max-width:100%}
#new,#out,#adm,#old{border:0;background:#ffffff38;color:#fff;border-radius:14px;padding:6px 12px;font:600 12px Cairo}
#subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.sub{flex:none;border:0;background:#ffffff30;color:#fff;border-radius:18px;padding:6px 12px;font:600 13px Cairo}
.sub.on{background:#fff;color:var(--p)}.sub:disabled{opacity:.45}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:flex-end}.row.me{justify-content:flex-end}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pl) var(--av) center/cover;border:1.5px solid var(--pm)}
.m{max-width:88%;padding:9px 12px;border-radius:18px;line-height:1.7;font-size:14.5px;word-break:break-word}
.bot .m{background:#fff;border:1.5px solid var(--pm);border-bottom-right-radius:6px;box-shadow:0 2px 8px #f06c9b14}
.me .m{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-bottom-left-radius:6px}
.body{white-space:pre-wrap}.body b{color:#d6477c}
.sec{border-right:4px solid;border-radius:12px;padding:6px 10px;margin:6px 0}
.s-a{background:#ffe8f1;border-color:#f06c9b}.s-a b{color:#d6477c}
.s-b{background:#e6f3ff;border-color:#5aa9f0}.s-b b{color:#1f78c8}
.s-c{background:#fff6d6;border-color:#f2c94c}.s-c b{color:#b07d00}
.s-d{background:#ffe9dc;border-color:#f2994a}.s-d b{color:#cf5f0e}
.s-e{background:#e3f7ea;border-color:#52c27b}.s-e b{color:#1f8a4c}
.s-f{background:#f1e8ff;border-color:#a77be8}.s-f b{color:#7b45cc}
.fig{margin-top:10px;background:var(--pl);border:1.5px solid var(--pm);border-radius:14px;padding:8px}.fig svg{width:100%;height:auto;display:block}
.src{font-size:12px;opacity:.65;margin-top:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border:1.5px solid var(--pm);background:var(--pl);color:var(--t);border-radius:14px;padding:4px 10px;font:600 12px Cairo}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0}
.cards button{border:1.5px solid var(--pm);background:#fff;color:var(--t);border-radius:16px;padding:14px 8px;font:700 14px Cairo}
.qz{margin:10px 0;padding:10px;background:var(--pl);border-radius:14px}.qz p{margin:0 0 8px;font-weight:700}
.qz button{display:block;width:100%;text-align:right;margin:5px 0;border:1.5px solid var(--pm);background:#fff;border-radius:12px;padding:8px 10px;font:500 14px Cairo;color:var(--t)}
.qz button.ok{background:#d7f5e3;border-color:#6fcf97}.qz button.no{background:#ffdce5;border-color:#f06c9b}
.qz .ex{font-size:13px;margin-top:6px}
.dots i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--p);animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,100%{opacity:.25}50%{opacity:1}}
form{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1.5px solid var(--pm)}
input{flex:1;padding:12px 16px;border:1.5px solid var(--pm);border-radius:24px;font:16px Cairo;background:var(--pl);color:var(--t);min-width:0;outline:none}
input:focus{border-color:var(--p)}
button.send{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:24px;padding:0 20px;font:700 15px Cairo}
button:disabled{opacity:.5}
.tool{flex:none;width:40px;border:1.5px solid var(--pm);background:var(--pl);border-radius:50%;font-size:19px;padding:0;color:var(--t)}
.tool.rec{background:#ff4d6d;color:#fff;border-color:#ff4d6d;width:auto;padding:0 12px;border-radius:24px;font:700 14px Cairo;animation:b 1s infinite}
#pend{display:none;padding:8px 14px 0;background:#fff}#pend.on{display:flex;align-items:center;gap:8px}
#pend img{height:56px;border-radius:10px;border:1.5px solid var(--pm)}#pend button{border:0;background:var(--pl);border-radius:50%;width:26px;height:26px;color:var(--t)}
#gate,#nameP{position:fixed;inset:0;z-index:50;background:linear-gradient(#fff,#ffe3ee);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
#gate h2,#nameP h2{margin:0;color:#d6477c}#gate p,#nameP p{margin:0;opacity:.8}#nameP{display:none;z-index:55}#nameIn{width:min(320px,90%);text-align:center;flex:none}
.gl{width:112px;height:112px;border-radius:50%;background:#fff var(--av) center/cover;border:3px solid #fff;box-shadow:0 6px 20px #f06c9b55}
#gbtn{border:0;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:26px;padding:14px 26px;font:700 16px Cairo;box-shadow:0 4px 14px #f06c9b55}
#gerr,#nameErr{color:#d6477c;min-height:18px}
.gs{display:flex;gap:10px}.gs button{border:2px solid #f6bcd2;background:#fff;color:#d6477c;border-radius:22px;padding:10px 24px;font:700 16px Cairo}.gs button.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-color:transparent}
#admP{position:fixed;inset:0;z-index:60;background:#fff;display:none;flex-direction:column;max-width:700px;margin:0 auto}#admP.on{display:flex}
#admH{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
#admH b{flex:1}#admH button{border:0;background:#ffffff38;color:#fff;border-radius:12px;padding:6px 12px;font:600 13px Cairo}
#admB{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.uc{display:flex;gap:10px;align-items:center;text-align:right;border:1.5px solid var(--pm);background:var(--pl);border-radius:14px;padding:10px;font:500 14px Cairo;color:var(--t)}
.uc img{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#fff}.uc small{display:block;opacity:.65}
.am{padding:9px 12px;border-radius:14px;max-width:92%;white-space:pre-wrap;line-height:1.7;font-size:14px}
.vbtn{border:0;background:#fff;border-radius:14px;padding:8px 14px;font:600 14px Cairo;color:var(--t)}
.am.me{background:var(--pm);align-self:flex-end}.am.bot{background:var(--pl);border:1px solid var(--pm);align-self:flex-start}
.bar{display:flex;gap:5px;margin-bottom:2px}.bar button{flex:1;min-width:0;padding:7px 4px;font-size:12px;white-space:nowrap}#subSel{flex:1.5;min-width:0;border:0;border-radius:14px;background:#fff;color:var(--p);padding:7px 6px;font:700 12.5px Cairo}
body{height:100dvh}header{padding-bottom:8px!important}.top{margin-bottom:6px!important}.top h1{font-size:16px!important}#chat{padding:10px 12px!important;gap:9px!important}
</style>
</head>
<body>
<div id="gate"><div class="gl"></div><h2>أهلًا بيكم مع فيفان 🌸</h2><p>الدخول بحساب جوجل بيحفظلك محادثاتك</p><button id="gbtn">🔐 الدخول بحساب جوجل</button><small id="gerr"></small></div>
<div id="nameP"><div class="gl"></div><h2>اسمك إيه؟ 🌸</h2><p>اسمك بالعربي + ولد ولا بنت؟ عشان أكلمك صح</p><input id="nameIn" maxlength="20" placeholder="اسمك بالعربي" autocomplete="off"><div class="gs"><button type="button" id="gM">👦 ولد</button><button type="button" id="gF">👧 بنت</button></div><small id="nameErr"></small><button id="gbtn2" class="send" style="padding:12px 26px;font-size:16px">يلا نبدأ ✨</button></div>
<div id="admP"><div id="admH"><button id="admBack">رجوع</button><b id="admT">👑 لوحة الأدمن</b><button id="admX">إغلاق</button></div><div id="admB"></div></div>
<header><div class="top"><div class="logo"></div><div><h1>فيفان</h1><small>مدرّستك الذكية • أولى إعدادي</small></div><button id="out">خروج</button></div><div class="bar"><select id="subSel"></select><button id="old">🕘 القديمة</button><button id="new">✨ جديدة</button><button id="adm" hidden>👑 الطلاب</button></div></header>
<div id="chat"></div>
<div id="pend"></div>
<form id="f"><input id="file" type="file" accept="image/*" hidden><button type="button" class="tool" id="pic">📷</button><button type="button" class="tool" id="mic">🎤</button><input id="q" placeholder="اسألي أو ابعتي صورة / فويس..." autocomplete="off"><button class="send" id="b">إرسال</button></form>

  let rq='',sub='';
  if(!mode&&!img){const k=await classify(q);if(k.t==='chat')mode='chat';else if(k.t==='unclear')mode='clarify';else{rq=k.q;sub=k.s}}
  let extra='';if(img){try{extra=await pre([{inline_data:{mime_type:img.mime,data:img.data}},{text:'اكتبي بالحرف أي نص أو سؤال أو مسألة في الصورة، ولو مفيش نص اوصفيها في سطر واحد. من غير شرح.'}])}catch(e){}}
  const sq=rq?rq+' '+q+' '+extra:((mode||q.length<25)&&lastQ?lastQ+' '+q:q)+' '+extra;if(!mode||q.length>=25||img)lastQ=(rq||q)+' '+extra;
  const hits=(mode==='chat'||mode==='clarify')?[]:search(sq,sub),ctx=hits.map(h=>`[${NAME[h.s]} — صفحة ${h.p}]\n${h.t.slice(0,3000)}`).join('\n\n---\n\n');
  const contents=hist.slice(-10).map(m=>({role:m.r,parts:[{text:m.t}]}));
  const up=[{text:`مقتطفات من الكتاب:\n${ctx||'(مفيش مقتطف مناسب)'}\n\nكلام ${T('الطالبة','الطالب')}: ${q}${img?'\n(مرفق صورة من '+T('الطالبة','الطالب')+')':''}`}];if(img)up.push({inline_data:{mime_type:img.mime,data:img.data}});
  contents.push({role:'user',parts:up});
  let ans='';
  try{
    const r=await fetch(WORKER_URL,{method:'POST',headers:await hdr(),body:JSON.stringify({ctx:{sc:scope,s:scope!=='all'?scope:sub,mode:mode||'',name:uname,gender},contents})});
    if(!r.ok)throw 0;
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(line.startsWith('data:')){try{const j=JSON.parse(line.slice(5)),t=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');if(t){ans+=t;if(mode!=='quiz'){renderBot(w,ans,false);$('chat').scrollTop=1e9}}}catch(e){}}}}
    if(!ans)throw 0;
    if(mode==='quiz'){
      const arr=JSON.parse(ans.replace(/```json|```/g,'').trim());renderQuiz(w,arr);hist.push({r:'user',t:(img?'[صورة] ':'')+q},{r:'model',t:'(عملتلها اختبار)'});tr.pop();
    }else{
      renderBot(w,ans,true);
      if(hits.length){const s=document.createElement('div');s.className='src';s.textContent='📄 '+[...new Set(hits.map(h=>NAME[h.s]+' ص'+h.p))].join(' • ');w.appendChild(s)}
      if(mode!=='chat'&&mode!=='clarify')acts(w,ans.replace(/```svg[\s\S]*?```/g,''));hist.push({r:'user',t:(img?'[صورة] ':'')+q},{r:'model',t:ans.replace(/```svg[\s\S]*?```/g,'(رسمة)')});tr.push({c:'bot',t:ans});
    }
    saveTr();
  }catch(e){w.textContent='حصلت مشكلة صغيرة، '+T('جربي','جرب')+' تاني بعد شوية 🌸';tr.pop()}
  $('b').disabled=false;$('chat').scrollTop=1e9;
}
$('f').onsubmit=e=>{e.preventDefault();ask($('q').value)};
$('new').onclick=reset;
const admB=$('admB');let backFn=null;const setBack=f=>{backFn=f;$('admBack').style.visibility=f?'visible':'hidden'};
const when=t=>t&&t.toDate?t.toDate().toLocaleString('ar-EG'):'';
const card=(u,sub,fn)=>{const b=document.createElement('button');b.className='uc';b.style.width='100%';if(u.photo){const i=document.createElement('img');i.src=u.photo;i.referrerPolicy='no-referrer';b.appendChild(i)}const d=document.createElement('div');d.textContent=u.name||u.title||'—';const sm=document.createElement('small');sm.textContent=sub;d.appendChild(sm);b.appendChild(d);b.onclick=fn;return b};
async function admUsers(){
  setBack(null);$('admT').textContent='👑 الطلاب';admB.textContent='جاري التحميل...';
  try{const sn=await getDocs(collection(db,'users')),a=sn.docs.map(d=>{const x={id:d.id,...d.data()};x.name=(x.nick?x.nick+' — ':'')+(x.name||'');return x}).sort((x,y)=>((y.lastSeen&&y.lastSeen.seconds)||0)-((x.lastSeen&&x.lastSeen.seconds)||0));
    $('admT').textContent='👑 الطلاب ('+a.length+')';admB.textContent='';a.forEach(u=>admB.appendChild(card(u,(u.email||'')+' • '+when(u.lastSeen),()=>admChats(u))));if(!a.length)admB.textContent='مفيش طلاب لسه.'}
  catch(e){admB.textContent='مش قادرة أقرا البيانات — تأكدي من قواعد Firestore.'}
}
async function admChats(u){
  setBack(admUsers);$('admT').textContent='💬 '+(u.name||u.email);admB.textContent='جاري التحميل...';
  try{const sn=await getDocs(query(collection(db,'users',u.id,'chats'),orderBy('updatedAt','desc')));admB.textContent='';
    sn.docs.forEach(d=>{const c=d.data();admB.appendChild(card({title:c.title},(c.messages||[]).length+' رسالة • '+when(c.updatedAt),()=>admView(u,c,d.id)))});if(!sn.docs.length)admB.textContent='مفيش محادثات.'}
  catch(e){admB.textContent='حصلت مشكلة في التحميل.'}
}
function voiceEl(d,uid,cid,m){
  const b=document.createElement('button');b.className='vbtn';b.textContent='🎤 اضغط لتشغيل الفويس';
  b.onclick=async()=>{b.disabled=true;b.textContent='جاري التحميل...';
    try{
      const sn=await getDoc(doc(db,'users',uid,'chats',cid,'voices',m.v));if(!sn.exists())throw 0;
      const x=sn.data(),bin=atob(x.d),u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
      const a=document.createElement('audio');a.controls=true;a.style.cssText='width:100%;max-width:260px';
      a.src=URL.createObjectURL(new Blob([u8],{type:x.mime||'audio/webm'}));
      a.onerror=()=>{const t=document.createElement('div');t.style.cssText='font-size:12px;opacity:.7;margin-top:4px';t.textContent='(المتصفح مش قادر يشغّل الصوت ده. المكتوب: '+String(m.t).replace(/^🎤\s*/,'')+')';d.appendChild(t)};
      b.replaceWith(a);a.play().catch(()=>{});
    }catch(e){b.disabled=false;b.textContent='🎤 الصوت مش متاح'}
  };
  d.appendChild(b);
}
function admView(u,c,cid){
  setBack(()=>admChats(u));$('admT').textContent=(c.title||'محادثة').slice(0,28);admB.textContent='';
  (c.messages||[]).forEach(m=>{const d=document.createElement('div');d.className='am '+m.c;if(m.c==='bot')d.innerHTML=md(m.t.replace(/```svg[\s\S]*?```/g,'(رسمة)'));else if(m.v&&cid)voiceEl(d,u.id,cid,m);else d.textContent=m.t;admB.appendChild(d)});
}
$('admBack').onclick=()=>backFn?backFn():0;
$('admX').onclick=()=>$('admP').classList.remove('on');
$('adm').onclick=()=>{if(!isAdm(auth.currentUser))return;$('admP').classList.add('on');admUsers()};
async function myChats(){
  $('admP').classList.add('on');setBack(null);$('admT').textContent='🕘 محادثاتي القديمة';admB.textContent='جاري التحميل...';
  try{const sn=await getDocs(query(collection(db,'users',user.uid,'chats'),orderBy('updatedAt','desc')));admB.textContent='';
    sn.docs.forEach(d=>{const c=d.data();admB.appendChild(card({title:c.title},(c.messages||[]).length+' رسالة • '+when(c.updatedAt),()=>loadChat(d.id,c)))});
    if(!sn.docs.length)admB.textContent='لسه مفيش محادثات قديمة 🌸'}
  catch(e){admB.textContent='مش قادرة أحمّل المحادثات دلوقتي.'}
}
function loadChat(id,c){
  chatId=id;tr=(c.messages||[]).map(m=>({c:m.c,t:m.t,...(m.v?{v:m.v}:{})}));hist=tr.slice(-12).map(m=>({r:m.c==='me'?'user':'model',t:m.t}));lastQ='';
  $('chat').innerHTML='';tr.forEach(x=>{const m=row(x.c);if(x.c==='bot'){renderBot(m,x.t,true);acts(m,x.t)}else m.textContent=x.t});
  $('admP').classList.remove('on');saveTr();
}
$('old').onclick=myChats;
$('out').onclick=async()=>{await signOut(auth);location.reload()};
$('gbtn').onclick=async()=>{
  if(FIREBASE_CONFIG.apiKey.startsWith('PUT'))return $('gerr').textContent='لسه محتاجين نحط إعدادات Firebase في الكود.';
  const pr=new GoogleAuthProvider();
  try{await signInWithPopup(auth,pr)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')signInWithRedirect(auth,pr);else if(e.code!=='auth/popup-closed-by-user')$('gerr').textContent='معرفتش أسجّل دخول ('+(e.code||'خطأ')+')'}
};
const AR=/^[\u0621-\u064A]+(?: [\u0621-\u064A]+)*$/;
async function ensureName(){
  let n='',g='';
  try{n=localStorage.getItem('nick_'+user.uid)||'';g=localStorage.getItem('gen_'+user.uid)||''}catch(e){}
  if(!n||!g){try{const d=await getDoc(doc(db,'users',user.uid));if(d.exists()){n=n||d.data().nick||'';g=g||d.data().gender||''}}catch(e){}}
  if(!AR.test(n))n='';
  if(g!=='m'&&g!=='f')g='';
  if(!n||!g){
    [n,g]=await new Promise(res=>{
      const P=$('nameP'),I=$('nameIn'),E=$('nameErr');let sel=g;
      I.value=n;P.style.display='flex';
      const paint=()=>{$('gM').classList.toggle('on',sel==='m');$('gF').classList.toggle('on',sel==='f')};paint();
      $('gM').onclick=()=>{sel='m';paint();E.textContent=''};
      $('gF').onclick=()=>{sel='f';paint();E.textContent=''};
      I.oninput=()=>{const c=I.value.replace(/[^\u0621-\u064A ]/g,'');if(c!==I.value){I.value=c;E.textContent='الاسم لازم يكون بالعربي ✍️'}else E.textContent=''};
      const go=()=>{const v=I.value.trim().replace(/\s+/g,' ').slice(0,20);
        if(!AR.test(v)){E.textContent='الاسم لازم يكون بالعربي ✍️';return I.focus()}
        if(!sel){E.textContent='ولد ولا بنت؟ اضغط على واحد منهم 👆';return}
        P.style.display='none';res([v,sel])};
      $('gbtn2').onclick=go;I.onkeydown=e=>{if(e.key==='Enter')go()};setTimeout(()=>I.focus(),150)});
  }
  try{localStorage.setItem('nick_'+user.uid,n);localStorage.setItem('gen_'+user.uid,g)}catch(e){}
  uname=n;gender=g;
  $('q').placeholder=T('اسألي أو ابعتي صورة / فويس...','اسأل أو ابعت صورة / فويس...');
}
onAuthStateChanged(auth,async u=>{
  if(!u)return;user=u;$('gate').style.display='none';
  $('adm').hidden=!isAdm(u);
  if(!started){started=true;await ensureName();init();cloud()}
});
</script>
