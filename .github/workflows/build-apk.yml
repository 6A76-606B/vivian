# حط الملف ده في: .github/workflows/build-apk.yml  (وجنبه index.html في أول الريبو)
# بيبني تطبيق أندرويد (APK) من index.html بـ Capacitor، والمايك (الفويسات) متفعّل،
# وتسجيل الدخول بجوجل بيشتغل بشكل native (جوجل بتمنع الدخول جوه الـ WebView العادي).
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - icon.jpg
      - .github/workflows/build-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: com.vefan.app
      APP_NAME: فيفان
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # مفتاح التوقيع: لازم يفضل ثابت، لأن بصمته (SHA-1) هي اللي بتتسجل في Firebase
      - name: Signing key
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            base64 -w0 ~/.android/debug.keystore > keystore.b64
            echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
            echo "::warning::اتعمل مفتاح توقيع جديد. نزّل الـ artifact اسمه keystore-b64 وحطه سر DEBUG_KEYSTORE_B64"
          fi
          echo "===== بصمة المفتاح (سجّلها في Firebase) ====="
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1|SHA256"

      - name: Save new keystore (first run only)
        if: env.NEW_KEYSTORE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y > /dev/null
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-firebase/authentication@7 @capacitor-firebase/messaging@7 @capacitor/filesystem@7 @capacitor/share@7
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "server": { "androidScheme": "https" },
            "plugins": {
              "FirebaseAuthentication": { "skipNativeAuth": true, "providers": ["google.com"] }
            }
          }
          EOF
          npx cap add android

      # المايك: من غير الصلاحيتين دول الفويسات مش هتسجّل
      - name: Add microphone permission
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M"
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />#' "$M"
          grep -q 'RECORD_AUDIO' "$M"

      # أيقونة التطبيق + شاشة البداية من نفس صورة فيفان (icon.jpg في الريبو لو موجودة، وإلا من AV جوه index.html)
      - name: App icon and splash
        run: |
          set -e
          # المصدر: icon.jpg في الريبو لو موجود، وإلا بنسحب الصورة من AV جوه index.html
          if [ ! -f icon.jpg ]; then
            node -e "const s=require('fs').readFileSync('index.html','utf8');const m=s.match(/const AV='data:image\/jpeg;base64,([^']+)'/);if(!m)process.exit(1);require('fs').writeFileSync('icon.jpg',Buffer.from(m[1],'base64'))"
          fi
          # ImageMagick مش دايمًا موجود على الـ runner (ده سبب exit code 127): نسطّبه لو ناقص
          if ! command -v convert >/dev/null && ! command -v magick >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          fi
          IM=convert; command -v convert >/dev/null || IM="magick"
          RES=android/app/src/main/res
          # أيقونة التطبيق (قديمة + دايرية + الـ foreground للأيقونات المتكيّفة)
          for d in "mdpi 48 108" "hdpi 72 162" "xhdpi 96 216" "xxhdpi 144 324" "xxxhdpi 192 432"; do
            set -- $d; D=$RES/mipmap-$1; S=$2; F=$3; mkdir -p $D
            $IM icon.jpg -resize ${S}x${S}! $D/ic_launcher.png
            C=$((S/2))
            $IM icon.jpg -resize ${S}x${S}! -alpha set \( -size ${S}x${S} xc:none -fill white -draw "circle $C,$C $C,0" \) -compose DstIn -composite $D/ic_launcher_round.png
            $IM icon.jpg -resize ${F}x${F}! $D/ic_launcher_foreground.png
          done
          mkdir -p $RES/values
          cat > $RES/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="ic_launcher_background">#FFFFFF</color></resources>
          XML
          # شاشة البداية: خلفية بيضا والصورة في النص (بنشيل splash.png القديمة عشان متتعارضش مع splash.xml)
          find $RES -maxdepth 2 -name 'splash.png' -delete
          mkdir -p $RES/drawable-nodpi $RES/drawable
          echo '<?xml version="1.0" encoding="utf-8"?><resources><color name="splash_bg">#FFFFFF</color></resources>' > $RES/values/splash_colors.xml
          $IM icon.jpg -resize 512x512! $RES/drawable-nodpi/splash_logo.png
          cat > $RES/drawable/splash.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item android:drawable="@color/splash_bg"/>
            <item android:gravity="center" android:width="170dp" android:height="170dp">
              <bitmap android:src="@drawable/splash_logo" android:gravity="fill"/>
            </item>
          </layer-list>
          XML
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$n.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done

      # الإشعارات: صلاحية أندرويد 13+ وأيقونة الإشعار (أبيض على شفاف) واللون والقناة الافتراضية
      - name: Notifications setup
        run: |
          M=android/app/src/main/AndroidManifest.xml
          RES=android/app/src/main/res
          mkdir -p $RES/drawable $RES/values
          cat > $RES/drawable/ic_stat_msg.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:pathData="M20,2H4C2.9,2 2,2.9 2,4v18l4,-4h14c1.1,0 2,-0.9 2,-2V4C22,2.9 21.1,2 20,2z"/>
          </vector>
          XML
          cat > $RES/values/notif_colors.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="notif_color">#7C5CFF</color></resources>
          XML
          grep -q 'POST_NOTIFICATIONS' "$M" || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' "$M"
          sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_msg" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/notif_color" />\n        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="msgs" />\n    </application>#' "$M"
          grep -q 'default_notification_channel_id' "$M"
          grep -q 'POST_NOTIFICATIONS' "$M"

      - name: google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            printf '%s' "$GS_JSON" > android/app/google-services.json
          else
            echo "::warning::السر GOOGLE_SERVICES_JSON مش موجود، فتسجيل الدخول بجوجل مش هيشتغل جوه التطبيق"
          fi

      - name: Build APK
        run: |
          npx cap sync android
          echo "===== البلجنز المسجّلة في التطبيق ====="
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q FirebaseAuthentication android/app/src/main/assets/capacitor.plugins.json
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: vefan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
