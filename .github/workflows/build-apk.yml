name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ID: com.vefan.app
      APP_NAME: فيفان
      KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup signing key
        shell: bash
        run: |
          mkdir -p ~/.android

          if [ -n "$KS_B64" ]; then
            printf '%s' "$KS_B64" | base64 -d > ~/.android/debug.keystore
          else
            keytool -genkeypair \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            base64 -w0 ~/.android/debug.keystore > keystore.b64
            echo "NEW_KEYSTORE=1" >> "$GITHUB_ENV"
            echo "::warning::اتعمل مفتاح جديد. احفظ keystore-b64 في DEBUG_KEYSTORE_B64"
          fi

          echo "===== بصمات مفتاح التوقيع ====="

          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey |
            grep -E "SHA1|SHA256"

      - name: Create Capacitor project
        run: |
          npm init -y

          npm install \
            @capacitor/core@7 \
            @capacitor/cli@7 \
            @capacitor/android@7 \
            @capacitor-firebase/authentication@7 \
            @capacitor-firebase/messaging@7 \
            @capacitor/filesystem@7 \
            @capacitor/share@7

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vefan.app",
            "appName": "فيفان",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "FirebaseAuthentication": {
                "skipNativeAuth": true,
                "providers": ["google.com"]
              }
            }
          }
          EOF

          mkdir -p www
          cp index.html www/index.html

          npx cap add android

      - name: Configure Google Credential Manager
        shell: bash
        run: |
          FILE="android/variables.gradle"

          if [ ! -f "$FILE" ]; then
            echo "::error::variables.gradle مش موجود"
            exit 1
          fi

          if grep -q "rgcfaIncludeGoogle" "$FILE"; then
            sed -i "s/rgcfaIncludeGoogle.*/rgcfaIncludeGoogle = true/" "$FILE"
          else
            sed -i '/ext {/a\    rgcfaIncludeGoogle = true' "$FILE"
          fi

          if grep -q "androidxCredentialsVersion" "$FILE"; then
            sed -i "s/androidxCredentialsVersion.*/androidxCredentialsVersion = '1.3.0'/" "$FILE"
          else
            sed -i "/rgcfaIncludeGoogle/a\\    androidxCredentialsVersion = '1.3.0'" "$FILE"
          fi

          echo "===== Google configuration ====="
          grep -E "rgcfaIncludeGoogle|androidxCredentialsVersion" "$FILE"

          npx cap update android

      - name: Configure Android permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/><application/' "$MANIFEST"

          sed -i 's/<application/<uses-permission android:name="android.permission.RECORD_AUDIO" \/><application/' "$MANIFEST"

      - name: Configure Firebase
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

          python3 -m json.tool android/app/google-services.json > /dev/null

          echo "===== Firebase package verification ====="

          python3 - <<'PY'
          import json

          with open("android/app/google-services.json") as f:
              data = json.load(f)

          clients = data.get("client", [])
          found = False

          for client in clients:
              info = client.get("client_info", {})
              package = info.get("android_client_info", {}).get("package_name")

              if package == "com.vefan.app":
                  found = True
                  print("Package:", package)

          if not found:
              raise SystemExit("Android package com.vefan.app not found in google-services.json")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEFAN-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
